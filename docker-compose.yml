services:
  venus-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: venus
      POSTGRES_USER: venus
      POSTGRES_PASSWORD: venus
    volumes:
      - venus-db-data:/var/lib/postgresql/data
    networks:
      - venus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venus"]
      interval: 5s
      timeout: 5s
      retries: 10

  venus-backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://venus:venus@venus-db:5432/venus
      VENUS_HOST: ${VENUS_HOST:-192.168.21.10}
      VENUS_PORT: ${VENUS_PORT:-9001}
      PORTAL_ID: ${PORTAL_ID:-c0619ab43e45}
      MQTT_TRANSPORT: ${MQTT_TRANSPORT:-websockets}
      MQTT_WS_PATH: ${MQTT_WS_PATH:-/}
      MQTT_TLS: ${MQTT_TLS:-false}
      MQTT_TLS_INSECURE: ${MQTT_TLS_INSECURE:-false}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      COOKIE_SECURE: "false"
      DASHBOARD_SETUP_TOKEN: ${DASHBOARD_SETUP_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    depends_on:
      venus-db:
        condition: service_healthy
    networks:
      - venus-net

  venus-frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - venus-backend
    networks:
      - venus-net

networks:
  venus-net:

volumes:
  venus-db-data:
